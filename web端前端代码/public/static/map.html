<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%; 
        }
    </style>
    <script src="https://api.map.baidu.com/api?v=3.0&ak=R5xBHsCCwrvqXjvctIFwrVBZfXUMgHtN"></script>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = new BMap.Map("map");
        var endPoint = new BMap.Point(117.2036, 39.1337); 


        map.centerAndZoom(endPoint, 15);


        var destinationMarker = new BMap.Marker(endPoint);
        map.addOverlay(destinationMarker);


        var infoWindow = new BMap.InfoWindow("目的地：天津五大道");
        destinationMarker.addEventListener("click", function() {
            this.openInfoWindow(infoWindow);
        });


        map.addControl(new BMap.NavigationControl()); 

        var startPoint = new BMap.Point(117.1905, 39.1256);
        findRoute(startPoint, endPoint);

        function findRoute(start, end) {
            var driving = new BMap.DrivingRoute(map, {
                renderOptions: { map: map, panel: "results" },
                onSearchComplete: function(results) {
                    if (driving.getStatus() === BMAP_STATUS_SUCCESS) {
                        addLandmarksAlongRoute(results.getPlan(0).getRoute(0).getPath());
                    }
                }
            });
            driving.search(start, end);
        }

        // 在路线附近添加随机标记
        function addLandmarksAlongRoute(routePoints) {
            routePoints.forEach(function(point, index) {
                // 每隔几个路点添加一个标记
                if (index % 5 === 0) { // 每5个路点添加一个标记
                    var offsetX = (Math.random() - 0.5) * 0.01; // 随机偏移量（经度）
                    var offsetY = (Math.random() - 0.5) * 0.01; // 随机偏移量（纬度）
                    var landmarkPoint = new BMap.Point(point.lng + offsetX, point.lat + offsetY);
                    
                    var landmarkMarker = new BMap.Marker(landmarkPoint); // 创建地标图标
                    map.addOverlay(landmarkMarker); // 添加到地图上

                    // 添加信息窗
                    var landmarkInfoWindow = new BMap.InfoWindow("地标");
                    landmarkMarker.addEventListener("click", (function(marker, info) {
                        return function() {
                            this.openInfoWindow(info);
                        };
                    })(landmarkMarker, landmarkInfoWindow));
                }
            });
        }
    </script>
</body>
</html>
